<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>みんなのおすすめスポット</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>みんなのおすすめスポット</h1>
    <nav aria-label="メインメニュー">
      <a href="#spots">スポット一覧</a>
      <a href="post.html">スポットを投稿</a>
    </nav>
  </header>

  <main>
    <section class="welcome">
      <h2>お気に入りの場所を見つけよう</h2>
      <p>みんなのおすすめスポットを見て、新しいお出かけ先を探してみましょう。</p>
      <a href="#spots">スポットを見る</a>
    </section>

    <section id="spots">
      <h2>おすすめスポット</h2>

      <ul class="spot-list">
        <li class="spot-card">
          <img src="images/cafe.jpg" alt="カフェの店内">
          <h3>落ち着くカフェ</h3>
          <p>ゆっくり過ごせる、お気に入りのカフェです。</p>
          <p>ジャンル：カフェ</p>
        </li>

        <li class="spot-card">
          <img src="images/park.jpg" alt="緑のある公園">
          <h3>自然いっぱいの公園</h3>
          <p>散歩や休憩にぴったりの場所です。</p>
          <p>ジャンル：公園</p>
        </li>
      </ul>
    </section>
  </main>

  <footer>
    <p>&copy; みんなのおすすめスポット</p>
  </footer>
</body>
</html>
